services:
  traefik:
    image: traefik:v3.6
    container_name: commandcenter-traefik
    restart: unless-stopped
    ports:
      - "192.168.178.19:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./volumes/traefik/dynamic:/etc/traefik/dynamic:ro
    command:
      - "--api.dashboard=false"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=odoo-proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.http.address=:80"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - odoo-proxy

  postgres:
    image: postgres:17
    container_name: odoo-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - odoo-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  portainer:
    image: portainer/portainer-ce@sha256:d27f76194b719bfe2a34779d51798a7adf02510cfba69ebcb538267f75aa4f47
    container_name: odoo-portainer
    restart: unless-stopped
    ports:
      - "${MANAGEMENT_BIND_IP:-192.168.178.19}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    environment:
      ADMIN_PASSWORD: ${PORTAINER_ADMIN_PASSWORD}
    networks:
      - management

networks:
  management:
    name: commandcenter-management
    driver: bridge
  odoo-proxy:
    name: odoo-proxy
    driver: bridge
