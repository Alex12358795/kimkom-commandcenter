global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["odoo-alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["odoo-node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["odoo-pg-exporter:9187"]

  - job_name: "client-nodes"
    file_sd_configs:
      - files: ["/etc/prometheus/exporter-targets/nodes.yml"]

  - job_name: "client-postgres"
    file_sd_configs:
      - files: ["/etc/prometheus/exporter-targets/postgres.yml"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["odoo-cadvisor:8080"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["odoo-alertmanager:9093"]

  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["odoo-blackbox-exporter:9115"]

  - job_name: "blackbox-http"
    metrics_path: "/probe"
    params:
      module: ["http_2xx"]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/http.yml"]
    relabel_configs:
      - source_labels: ["__address__"]
        target_label: "__param_target"
      - source_labels: ["__param_target"]
        target_label: "instance"
      - target_label: "__address__"
        replacement: "odoo-blackbox-exporter:9115"

  - job_name: "blackbox-https"
    metrics_path: "/probe"
    params:
      module: ["https_2xx"]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/https.yml"]
    relabel_configs:
      - source_labels: ["__address__"]
        target_label: "__param_target"
      - source_labels: ["__param_target"]
        target_label: "instance"
      - target_label: "__address__"
        replacement: "odoo-blackbox-exporter:9115"
