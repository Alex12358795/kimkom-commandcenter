services:
  odoo:
    build: .
    container_name: odoo-vranckeneers
    restart: unless-stopped
    expose:
      - 8069
      - 8072
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
      - ./addons-enterprise:/mnt/extra-enterprise
      - ./addons-oca:/mnt/extra-oca
      - ./data:/var/lib/odoo/data
    environment:
      DB_HOST: odoo-postgres
      DB_PORT: 5432
      DB_USER: odoo_vranckeneers
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: odoovranckeneers
    labels:
      - traefik.enable=true
      - traefik.http.routers.vranckeneers.rule=Host(`vranckeneers.kimkom.net`)
      - traefik.http.routers.vranckeneers.entrypoints=http
      - traefik.http.routers.vranckeneers.service=vranckeneers
      - traefik.http.services.vranckeneers.loadbalancer.server.port=8069
      - "traefik.http.routers.vranckeneers-login.rule=Host(`vranckeneers.kimkom.net`) && (PathPrefix(`/web/login`) || PathPrefix(`/web/session/authenticate`))"
      - traefik.http.routers.vranckeneers-login.entrypoints=http
      - traefik.http.routers.vranckeneers-login.priority=200
      - traefik.http.routers.vranckeneers-login.service=vranckeneers
      - "traefik.http.routers.vranckeneers-login.middlewares=login-rate-limit@file"
      - "traefik.http.routers.vranckeneers-websocket.rule=Host(`vranckeneers.kimkom.net`) && PathPrefix(`/websocket`)"
      - traefik.http.routers.vranckeneers-websocket.entrypoints=http
      - traefik.http.routers.vranckeneers-websocket.priority=100
      - traefik.http.routers.vranckeneers-websocket.service=vranckeneers-websocket
      - traefik.http.services.vranckeneers-websocket.loadbalancer.server.port=8072
    networks:
      - odoo-proxy

networks:
  odoo-proxy:
    name: odoo-proxy
    external: true
